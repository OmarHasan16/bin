{{ "<!-- Article/BlogPosting Schema -->" | safeHTML }}
{{ if .IsPage }}
    {{ if eq .Type "blog" }}
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "BlogPosting",
            "headline": "{{ .Title | safeJS }}",
            "description": "{{ if .Params.description }}{{ .Params.description | safeJS }}{{ else }}{{ .Summary | safeJS }}{{ end }}",
            "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
            "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
            "author": {
                "@type": "Person",
                "name": "{{ .Params.author | default "10Corp Team" }}",
                "url": "{{ .Site.BaseURL }}"
            },
            "publisher": {
                "@type": "Organization",
                "name": "{{ .Site.Params.organization }}",
                "logo": {
                    "@type": "ImageObject",
                    "url": "{{ .Site.Params.logo | absURL }}"
                }
            },
            "mainEntityOfPage": {
                "@type": "WebPage",
                "@id": "{{ .Permalink }}"
            },
            {{ with .Params.image }}"image": {
                "@type": "ImageObject",
                "url": "{{ . | absURL }}",
                "width": 1200,
                "height": 630
            },{{ end }}
            {{ with .Params.keywords }}"keywords": {{ . | jsonify }},{{ end }}
            "inLanguage": "en-US",
            "wordCount": {{ .WordCount }}
        }
        </script>
    {{ end }}
{{ end }}

{{ "<!-- Organization & LocalBusiness Schema -->" | safeHTML }}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": ["Organization", "LocalBusiness", "ProfessionalService"],
    "name": "{{ .Site.Params.organization }}",
    "alternateName": "10Corp Web Design Company",
    "url": "{{ .Site.BaseURL }}",
    "logo": {
        "@type": "ImageObject",
        "url": "{{ .Site.Params.logo | absURL }}",
        "width": 250,
        "height": 60
    },
    "description": "Leading web design company specializing in custom websites, eCommerce solutions, hosting, domains, and digital marketing services.",
    "telephone": "{{ .Site.Params.telephone }}",
    "email": "{{ .Site.Params.email }}",
    "address": {
        "@type": "PostalAddress",
        "streetAddress": "{{ .Site.Params.address }}",
        "addressLocality": "{{ .Site.Params.addressLocality }}",
        "addressRegion": "{{ .Site.Params.addressRegion }}",
        "postalCode": "{{ .Site.Params.postalCode }}",
        "addressCountry": "{{ .Site.Params.country }}"
    },
    "geo": {
        "@type": "GeoCoordinates",
        "latitude": "45.6063",
        "longitude": "-122.7255"
    },
    "priceRange": "{{ .Site.Params.priceRange }}",
    "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        "opens": "09:00",
        "closes": "17:00"
    },
    "sameAs": [
        "{{ .Site.Params.socialFacebook }}",
        "{{ .Site.Params.socialTwitter }}",
        "{{ .Site.Params.socialInstagram }}",
        "https://www.linkedin.com/company/10corp/"
    ],
    "contactPoint": [{
        "@type": "ContactPoint",
        "telephone": "{{ .Site.Params.telephone }}",
        "contactType": "Customer Service",
        "email": "{{ .Site.Params.email }}",
        "areaServed": ["US", "CA", "GB"],
        "availableLanguage": ["English", "Spanish", "French"]
    }],
    "areaServed": {
        "@type": "Place",
        "name": "Worldwide"
    },
    "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Web Design Services",
        "itemListElement": [{
            "@type": "Offer",
            "itemOffered": {
                "@type": "Service",
                "name": "Website Design",
                "serviceType": "Web Design"
            }
        }, {
            "@type": "Offer",
            "itemOffered": {
                "@type": "Service",
                "name": "Web Hosting",
                "serviceType": "Web Hosting"
            }
        }, {
            "@type": "Offer",
            "itemOffered": {
                "@type": "Service",
                "name": "Domain Registration",
                "serviceType": "Domain Services"
            }
        }]
    }
}
</script>

{{ "<!-- WebSite Schema with Sitelinks SearchBox -->" | safeHTML }}
{{ if .IsHome }}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ .Site.Title }}",
    "url": "{{ .Site.BaseURL }}",
    "description": "{{ .Site.Params.description | default "Professional web design and development services" }}",
    "publisher": {
        "@type": "Organization",
        "name": "{{ .Site.Params.organization }}"
    },
    "potentialAction": {
        "@type": "SearchAction",
        "target": {
            "@type": "EntryPoint",
            "urlTemplate": "{{ .Site.BaseURL }}search/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
    },
    "inLanguage": "en-US"
}
</script>
{{ end }}

{{ "<!-- BreadcrumbList Schema -->" | safeHTML }}
{{ if not .IsHome }}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
        {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "{{ .Site.BaseURL }}"
        }
        {{ $sections := split .RelPermalink "/" }}
        {{ $url := .Site.BaseURL }}
        {{ range $index, $section := $sections }}
            {{ if and $section (ne $section "") }}
                {{ $url = printf "%s%s/" $url $section }}
                ,{
                    "@type": "ListItem",
                    "position": {{ add $index 2 }},
                    "name": "{{ humanize $section }}",
                    "item": "{{ $url }}"
                }
            {{ end }}
        {{ end }}
    ]
}
</script>
{{ end }}
