<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "{{ .Site.Params.organization }}",
  "url": "{{ .Site.BaseURL }}",
  "logo": "{{ .Site.Params.logo | absURL }}",
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "{{ .Site.Params.telephone }}",
    "contactType": "customer service",
    "email": "{{ .Site.Params.email }}"
  },
  "sameAs": [
    "{{ .Site.Params.socialFacebook }}",
    "{{ .Site.Params.socialTwitter }}",
    "{{ .Site.Params.socialInstagram }}"
  ]
}
</script>

{{ if or .IsHome (eq .Title "Contact") }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "{{ .Site.Params.organization }}",
  "image": "{{ .Site.Params.logo | absURL }}",
  "telephone": "{{ .Site.Params.telephone }}",
  "email": "{{ .Site.Params.email }}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "{{ .Site.Params.address }}",
    "addressLocality": "{{ .Site.Params.addressLocality }}",
    "addressRegion": "{{ .Site.Params.addressRegion }}",
    "postalCode": "{{ .Site.Params.postalCode }}",
    "addressCountry": "{{ .Site.Params.country }}"
  },
  "priceRange": "{{ .Site.Params.priceRange }}",
  "openingHours": "{{ .Site.Params.openingHours }}"
}
</script>
{{ end }}

{{ if and .IsPage (eq .Type "post") }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ .Title }}",
  "image": "{{ if .Params.image }}{{ .Params.image | absURL }}{{ else }}{{ .Site.Params.logo | absURL }}{{ end }}",
  "datePublished": "{{ .Date.Format "2006-01-02" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02" }}",
  "author": {
    "@type": "Person",
    "name": "{{ .Params.author | default .Site.Params.authorName }}"
  },
  "publisher": {
    "@type": "Organization",
    "name": "{{ .Site.Params.organization }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ .Site.Params.logo | absURL }}"
    }
  },
  "description": "{{ .Summary | plainify }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink }}"
  }
}
</script>
{{ end }}

{{ if eq .Title "Pricing" }}
<script type="application/ld+json">
[
  {
    "@context": "https://schema.org",
    "@type": "Service",
    "serviceType": "Website Builder - Standard Plan",
    "provider": { "@type": "Organization", "name": "{{ .Site.Params.organization }}" },
    "offers": {
      "@type": "Offer",
      "price": "29.99",
      "priceCurrency": "USD",
      "url": "{{ .Permalink }}"
    }
  },
  {
    "@context": "https://schema.org",
    "@type": "Service",
    "serviceType": "Website Builder - Popular Plan",
    "provider": { "@type": "Organization", "name": "{{ .Site.Params.organization }}" },
    "offers": {
      "@type": "Offer",
      "price": "59.99",
      "priceCurrency": "USD",
      "url": "{{ .Permalink }}"
    }
  }
]
</script>
{{ end }}
